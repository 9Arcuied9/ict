<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>道路病害地图</title>
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.5 "Microsoft YaHei", sans-serif; color: #1f2933; }
  body { display: grid; grid-template: "panel map" minmax(0, 1fr) / 258px minmax(0, 1fr); }
  #map { grid-area: map; position: relative; background: #f5f7fa; }
  #panel { grid-area: panel; padding: 12px 14px; overflow: auto; background: #fff; border-right: 1px solid #d9e2ec; }
  #panel h1 { margin: 0 0 8px; font-size: 16px; }
  #panel label { display: block; margin-top: 8px; color: #52606d; font-size: 12px; }
  #panel select, #panel input[type=date] { width: 100%; box-sizing: border-box; padding: 4px 6px; margin-top: 2px; }
  #panel .row { display: flex; gap: 12px; margin-top: 10px; }
  #panel .row label { display: flex; align-items: center; gap: 4px; margin: 0; font-size: 13px; color: inherit; }
  #count { margin-top: 10px; font-size: 12px; color: #52606d; }
  #legend { margin-top: 8px; font-size: 12px; }
  #legend span { display: inline-block; margin-right: 10px; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  #msg { color: #52606d; white-space: pre-line; }
  #panel [hidden] { display: none; }
  #archives { border-top: 1px solid #e4e7eb; margin-top: 12px; }
  #archives h2 { font-size: 14px; margin: 10px 0 4px; }
  #archives ul { list-style: none; margin: 0; padding: 0; }
  #archives li { display: flex; flex-wrap: wrap; column-gap: 8px; margin: 5px 0; }
  #archives li span { color: #52606d; font-size: 12px; }
  .info { min-width: 200px; }
  .info img { display: block; width: 220px; margin-top: 6px; border-radius: 4px; }
  .info .tag { color: #b54708; font-size: 12px; }
  @media (max-width: 580px) {
    body { grid-template: "panel" fit-content(42%) "map" minmax(0, 1fr) / minmax(0, 1fr); }
    #panel { border-right: 0; border-bottom: 1px solid #d9e2ec; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>道路病害地图</h1>
  <label>类型
    <select id="type">
      <option value="">全部</option>
      <option value="D00">D00 纵向裂缝</option>
      <option value="D10">D10 横向裂缝</option>
      <option value="D20">D20 龟裂</option>
      <option value="D40">D40 坑槽</option>
    </select>
  </label>
  <label id="severityFilter">严重程度
    <select id="sev">
      <option value="">全部</option>
      <option>轻</option><option>中</option><option>重</option>
    </select>
  </label>
  <label>最近观测不早于 <input type="date" id="from"></label>
  <label>最近观测不晚于 <input type="date" id="to"></label>
  <div class="row">
    <label><input type="checkbox" id="showPoints" checked> 点标记</label>
    <label><input type="checkbox" id="showHeat"> 热力图</label>
  </div>
  <div id="legend">
    <span><i style="background:#2f9e44"></i>轻</span>
    <span><i style="background:#f08c00"></i>中</span>
    <span><i style="background:#e03131"></i>重</span>
  </div>
  <div id="count"></div>
  <p id="msg" role="status" hidden></p>
  <section id="archives" hidden>
    <h2>病害列表</h2>
    <ul id="archiveList"></ul>
  </section>
</div>

<script src="config.js"></script>
<script>
const CFG = window.MAP_CONFIG || {};
// The FastAPI route uses the database. The stand-alone static map uses its configured data files.
const databaseMap = location.pathname === '/map/';
const TYPE_NAME = { D00: '纵向裂缝', D10: '横向裂缝', D20: '龟裂', D40: '坑槽' };
const SEV_COLOR = { 轻: '#2f9e44', 中: '#f08c00', 重: '#e03131' };
const SEV_WEIGHT = { 轻: 1, 中: 2, 重: 3 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let AMapRef, map, heatmap, infoWindow, markers = [], all = [];

function showMessage(text) {
  $('msg').textContent = text;
  $('msg').hidden = false;
}

async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} 返回 ${res.status}`);
  return res.json();
}

function hasCoordinates(defect) {
  return Number.isFinite(defect.lng_gcj) && Number.isFinite(defect.lat_gcj);
}

function detailUrl(defect) {
  return '/?id=' + encodeURIComponent(defect.id);
}

function renderArchiveList(list) {
  const rows = list.map(defect => {
    const row = document.createElement('li');
    const link = document.createElement('a');
    link.href = detailUrl(defect);
    link.textContent = `#${defect.id} ${TYPE_NAME[defect.type] || defect.type}`;
    row.append(link);
    if (!hasCoordinates(defect)) {
      const status = document.createElement('span');
      status.textContent = '暂无定位';
      row.append(status);
    }
    return row;
  });
  $('archiveList').replaceChildren(...rows);
  $('archives').hidden = !rows.length;
}

function filtered() {
  const type = $('type').value, sev = $('sev').value;
  const from = $('from').value, to = $('to').value;
  return all.filter(d => {
    // Compare on the local calendar day so the date pickers match what the user sees.
    const day = d.last_seen ? new Date(d.last_seen).toLocaleDateString('sv-SE') : '';
    return (!type || d.type === type) && (!sev || d.severity === sev) &&
           (!from || day >= from) && (!to || day <= to);
  });
}

function infoHtml(d) {
  const seen = d.last_seen ? new Date(d.last_seen).toLocaleString('zh-CN') : '未知';
  return `<div class="info">
    <b>${esc(d.type)} ${esc(TYPE_NAME[d.type] || '')}${d.severity ? ' / ' + esc(d.severity) : ''}</b>
    ${d.demo ? '<div class="tag">演示数据，非真实检测</div>' : ''}
    <div>编号：${esc(d.id)}</div>
    <div>观测次数：${esc(d.obs_count)}</div>
    <div>最近观测：${esc(seen)}</div>
    ${d.status ? '<div>状态：' + esc(d.status) + '</div>' : ''}
    ${d.image_url ? `<img src="${esc(d.image_url)}" alt="证据图">` : ''}
    ${databaseMap ? `<a href="${esc(detailUrl(d))}">查看病害详情</a>` : ''}
  </div>`;
}

function render() {
  const list = filtered();
  const located = list.filter(hasCoordinates);
  $('count').textContent = `显示 ${list.length} / ${all.length} 处病害${databaseMap ? '，已定位 ' + located.length + ' 处' : ''}`;
  if (databaseMap) renderArchiveList(list);
  if (!map) return;

  map.remove(markers);
  markers = [];
  if ($('showPoints').checked) {
    markers = located.map(d => {
      const m = new AMapRef.CircleMarker({
        center: [d.lng_gcj, d.lat_gcj], radius: 8, zIndex: 20, cursor: 'pointer',
        fillColor: SEV_COLOR[d.severity] || '#868e96', fillOpacity: 0.9,
        strokeColor: '#fff', strokeWeight: 2,
      });
      m.on('click', () => {
        infoWindow.setContent(infoHtml(d));
        infoWindow.open(map, [d.lng_gcj, d.lat_gcj]);
      });
      return m;
    });
    map.add(markers);
  }
  if ($('showHeat').checked) {
    heatmap.setDataSet({
      data: located.map(d => ({ lng: d.lng_gcj, lat: d.lat_gcj, count: (SEV_WEIGHT[d.severity] || 1) * (d.obs_count || 1) })),
      max: 6,
    });
    heatmap.show();
  } else {
    heatmap.hide();
  }
}

async function loadMap() {
  if (!(CFG.key && CFG.securityJsCode)) throw new Error('请在 web/config.js 配置高德密钥。');
  window._AMapSecurityConfig = { securityJsCode: CFG.securityJsCode };
  await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://webapi.amap.com/loader.js';
    script.onload = resolve;
    script.onerror = () => reject(new Error('无法加载高德地图服务。'));
    document.head.append(script);
  });
  AMapRef = await AMapLoader.load({ key: CFG.key, version: '2.0', plugins: ['AMap.HeatMap', 'AMap.Scale'] });
  const first = all.find(hasCoordinates);
  const center = first ? [first.lng_gcj, first.lat_gcj] : [108.985, 34.2507];
  map = new AMapRef.Map('map', { zoom: 17, center });
  map.addControl(new AMapRef.Scale());
  heatmap = new AMapRef.HeatMap(map, { radius: 28, opacity: [0, 0.8] });
  heatmap.hide();
  infoWindow = new AMapRef.InfoWindow({ offset: new AMapRef.Pixel(0, -8) });

  if (!databaseMap && CFG.trackUrl) {
    try {
      const path = await getJson(CFG.trackUrl);
      map.add(new AMapRef.Polyline({ path, strokeColor: '#1c7ed6', strokeWeight: 4, strokeOpacity: 0.6 }));
    } catch (e) {
      console.warn('轨迹未加载：', e.message);
    }
  }
  render();
  if (markers.length > 1) map.setFitView(markers, false, [32, 32, 32, 32]);
}

async function start() {
  if (location.protocol === 'file:') {
    return showMessage('请通过本地服务打开地图页。启动 backend/start-local.cmd 后访问 http://127.0.0.1:8017/map/');
  }
  if (databaseMap) {
    $('severityFilter').hidden = true;
    $('legend').hidden = true;
  }
  try {
    all = await getJson(databaseMap ? '/api/defects' : CFG.defectsUrl);
  } catch (error) {
    return showMessage('病害数据读取失败：' + error.message);
  }
  ['type', 'sev', 'from', 'to', 'showPoints', 'showHeat'].forEach(id => $(id).addEventListener('change', render));
  render();
  try {
    await loadMap();
  } catch (error) {
    showMessage('底图加载失败：' + (error.message || error) + (databaseMap ? ' 可从列表打开详情。' : ''));
  }
}
start();
</script>
</body>
</html>
